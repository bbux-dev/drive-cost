<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f2">
    <meta name="description" content="A little clarity on what your drive costs. Private, offline trip and fuel tracking for your Niro.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Drive cost</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="desktop-note"><span class="note-dot"></span> A little clarity for every mile.</div>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#trips" aria-label="Drive cost home"><span class="brand-icon" aria-hidden="true">↗</span> drive cost<span class="brand-dot">.</span></a>
        <button class="icon-button" id="settings-button" aria-label="Settings"></button>
      </header>
      <aside id="update-banner" class="update-banner" aria-label="App update" hidden>
        <span>A fresh version is ready.</span>
        <button type="button" data-action="apply-update">Update</button>
      </aside>
      <main id="main"></main>
      <nav class="bottom-nav" aria-label="Main navigation"></nav>
    </div>
    <p class="desktop-footer">2020 KIA NIRO PHEV <span>·</span> YOUR DATA STAYS HERE</p>
    <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>This local app needs JavaScript to calculate and save your trips.</noscript>
  </body>
</html>
